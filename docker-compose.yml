version: '3.8'

services:
  market-maker:
    build:
      context: .
      dockerfile: Dockerfile
    image: hft-market-maker:latest
    container_name: hft-market-maker

    # Restart policy for production
    restart: unless-stopped

    # Environment variables from .env file
    env_file:
      - .env

    # Override specific environment variables
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - SYMBOL=${SYMBOL:-BTCUSDT}
      - ORDER_SIZE=${ORDER_SIZE:-0.001}
      - SPREAD_PERCENTAGE=${SPREAD_PERCENTAGE:-0.02}

    # Volume mounts
    volumes:
      # Mount logs directory (persistent across container restarts)
      - ./logs:/app/logs

      # Mount config directory (for easy config updates without rebuild)
      - ./config:/app/config:ro

    # Resource limits (adjust based on VPS specs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

    # Network mode (host for minimal latency - use with caution)
    # network_mode: "host"

    # Or use custom network
    networks:
      - trading-net

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    # Command override (optional - specify different config file)
    # command: ["config/config.testnet.json"]

networks:
  trading-net:
    driver: bridge
